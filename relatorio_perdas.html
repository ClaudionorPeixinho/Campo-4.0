<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#198754">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Campo 4.0">
    <link rel="apple-touch-icon" href="Img/tecnologia-campo5.png">
    <link rel="stylesheet" href="css/app-base.css">
    <link rel="stylesheet" href="css/StyleApto.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Perdas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #27ae60;
            --primary-dark: #219a52;
            --primary-light: #2ecc71;
            --secondary-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --success-color: #27ae60;
            --dark-color: #2c3e50;
            --gray-color: #95a5a6;
            --light-color: #ecf0f1;
            --white: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
        }

        body.dark {
            --white: #1a1a1a;
            --light-color: #2d2d2d;
            --dark-color: #e0e0e0;
            --gray-color: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card-principal {
            background: var(--white);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        body.dark .card-principal {
            background: #2d2d2d;
            color: #e0e0e0;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary-color);
        }

        body.dark .page-title {
            color: var(--primary-light);
            border-bottom-color: var(--primary-light);
        }

        .page-title i { font-size: 1.6rem; }

        .filters-section {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.05), rgba(46, 204, 113, 0.05));
            border: 1px solid rgba(39, 174, 96, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        body.dark .filters-section {
            background: rgba(39, 174, 96, 0.08);
            border-color: rgba(39, 174, 96, 0.25);
        }

        .filters-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--dark-color);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group label i { color: var(--primary-color); }

        body.dark .filter-group label { color: #e0e0e0; }

        .filter-group input,
        .filter-group select {
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--white);
            color: var(--dark-color);
            transition: all 0.3s ease;
        }

        body.dark .filter-group input,
        body.dark .filter-group select {
            background: #3d3d3d;
            color: #e0e0e0;
            border-color: #555;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-filtrar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--white);
            box-shadow: var(--shadow-sm);
        }

        .btn-filtrar:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-limpar {
            background: var(--light-color);
            color: var(--dark-color);
        }

        .btn-limpar:hover {
            background: var(--gray-color);
            color: var(--white);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: var(--shadow-sm);
        }

        .table-report {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .table-report thead {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--white);
        }

        .table-report th {
            padding: 14px 16px;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
        }

        .table-report th i { margin-right: 6px; }

        .table-report td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--light-color);
            color: var(--dark-color);
        }

        body.dark .table-report td {
            border-bottom: 1px solid #555;
            color: #e0e0e0;
        }

        .table-report tbody tr {
            transition: all 0.2s ease;
        }

        .table-report tbody tr:hover {
            background: var(--light-color);
        }

        body.dark .table-report tbody tr:hover {
            background: #3d3d3d;
        }

        .table-report tbody tr:last-child td {
            border-bottom: none;
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }

        .total-box {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.08), rgba(46, 204, 113, 0.08));
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 20px 25px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .total-box .label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        body.dark .total-box .label { color: #e0e0e0; }

        .total-box .label i { color: var(--primary-color); }

        .total-box .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .total-box .value span {
            font-size: 1rem;
            font-weight: 600;
        }

        .registros-count {
            font-size: 0.85rem;
            color: var(--gray-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        body.dark .registros-count { color: #b0b0b0; }

        .registros-count strong { color: var(--dark-color); }

        body.dark .registros-count strong { color: #e0e0e0; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--light-color);
            margin-bottom: 15px;
        }

        .empty-state p {
            color: var(--gray-color);
            font-size: 1.1rem;
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            gap: 12px;
            color: var(--gray-color);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid var(--light-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .summary-row td {
            font-weight: 700;
            background: rgba(39, 174, 96, 0.04);
        }

        body.dark .summary-row td {
            background: rgba(39, 174, 96, 0.1);
        }

        @media (max-width: 768px) {
            .container { padding: 15px 10px; }
            .card-principal { padding: 15px; }
            .page-title { font-size: 1.2rem; }
            .filters-grid { grid-template-columns: 1fr; gap: 10px; }
            .filter-buttons { flex-direction: column; }
            .filter-buttons button { width: 100%; justify-content: center; }
            .table-report th,
            .table-report td { padding: 8px 10px; font-size: 0.8rem; }
            .total-box { flex-direction: column; text-align: center; }
            .total-box .value { font-size: 1.5rem; }
            .registros-count { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom px-3">
        <div class="w-100 d-flex align-items-center position-relative">
            <div class="flex-grow-1 text-center">
                <h3 class="text-white mb-0"><i class="bi bi-bar-chart-line"></i> Campo 4.0 - Relatório de Perdas</h3>
            </div>
            <div class="d-flex align-items-center gap-2 position-absolute end-0 me-3">
                <button class="btn btn-sm text-white border-0" id="btnToggleTheme" title="Alternar tema" style="background:rgba(255,255,255,0.2);border-radius:6px;padding:6px 10px;">
                    <i class="bi bi-brightness-high"></i>
                </button>
                <a class="nav-link text-white p-0" href="javascript:void(0)" onclick="sair()">
                    <i class="bi bi-box-arrow-left"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top:15px;">
        <div class="d-flex justify-content-end align-items-center mb-3 flex-wrap gap-2">
            <div class="dropdown">
                <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-cog"></i> Ações
                </button>
                <ul class="dropdown-menu shadow">
                    <li><a class="dropdown-item" href="#" onclick="carregarDados()"><i class="fas fa-redo"></i> Atualizar</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" onclick="exportarPDF()"><i class="fas fa-file-pdf" style="color:#e74c3c;"></i> Exportar PDF</a></li>
                    <li><a class="dropdown-item" href="#" onclick="exportarExcel()"><i class="fas fa-file-excel" style="color:#27ae60;"></i> Exportar Excel</a></li>
                </ul>
            </div>
        </div>
        <div class="card-principal">
            <div class="page-title">
                <i class="bi bi-bar-chart-line"></i> Relatório de Perdas
            </div>

            <div class="filters-section">
                <div class="filters-title" onclick="toggleFiltros()" style="cursor:pointer;">
                    <i class="bi bi-funnel"></i> Filtros
                    <i class="bi bi-chevron-down" id="filterToggleIcon" style="margin-left:auto;transition:transform 0.3s ease;"></i>
                </div>
                <div id="filtersContent" style="display:none;">
                    <div class="filters-grid">
                        <div class="filter-group">
                            <label for="fFrota"><i class="bi bi-gear"></i> Frota / Equipamento</label>
                            <input type="text" id="fFrota" placeholder="Ex: Colhedora 01" list="frotaList">
                            <datalist id="frotaList"></datalist>
                        </div>
                        <div class="filter-group">
                            <label for="fOperador"><i class="bi bi-person"></i> Operador</label>
                            <input type="text" id="fOperador" placeholder="Nome do operador" list="operadorList">
                            <datalist id="operadorList"></datalist>
                        </div>
                        <div class="filter-group">
                            <label for="fLote"><i class="bi bi-box"></i> Lote</label>
                            <input type="text" id="fLote" placeholder="Ex: L-001" list="loteList">
                            <datalist id="loteList"></datalist>
                        </div>
                        <div class="filter-group">
                            <label for="fDataInicio"><i class="bi bi-calendar-range"></i> Data Início</label>
                            <input type="date" id="fDataInicio">
                        </div>
                        <div class="filter-group">
                            <label for="fDataFim"><i class="bi bi-calendar-range"></i> Data Fim</label>
                            <input type="date" id="fDataFim">
                        </div>
                    </div>
                    <div class="filter-buttons">
                        <button class="btn-filtrar" onclick="filtrar()">
                            <i class="bi bi-search"></i> Pesquisar
                        </button>
                        <button class="btn-limpar" onclick="limparFiltros()">
                            <i class="bi bi-arrow-clockwise"></i> Limpar Filtros
                        </button>
                    </div>
                </div>
            </div>

            <div class="registros-count" id="registrosCount">
                <i class="bi bi-database"></i>
                <span>Carregando dados...</span>
            </div>

            <div class="table-wrapper">
                <table class="table-report">
                    <thead>
                        <tr>
                            <th><i class="bi bi-calendar"></i>Data</th>
                            <th><i class="bi bi-gear"></i>Frota</th>
                            <th><i class="bi bi-person"></i>Operador</th>
                            <th><i class="bi bi-box"></i>Lote</th>
                            <th><i class="bi bi-grid-3x3"></i>Quadra</th>
                            <th><i class="bi bi-file-earmark"></i>OS</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Tocos</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Pontas</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Lascas</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Pedaços</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Inteiras</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Toletes</th>
                            <th class="text-right"><i class="bi bi-plus-circle"></i>Palmitos</th>
                            <th class="text-right"><i class="bi bi-graph-down"></i>Total Perdas</th>
                        </tr>
                    </thead>
                    <tbody id="tabela">
                        <tr>
                            <td colspan="14" class="text-center" style="padding: 40px; color: var(--gray-color);">
                                <div class="loading-spinner">
                                    <div class="spinner"></div>
                                    <span>A carregar dados...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="total-box">
                <div class="label">
                    <i class="bi bi-calculator"></i> Total Geral de Perdas
                </div>
                <div class="value" id="totalGeral">0 <span>un</span></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/offline-sync.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/relatorio_perdas.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .catch(err => console.warn('SW registration falhou:', err));
            });
        }
    </script>
</body>
</html>
